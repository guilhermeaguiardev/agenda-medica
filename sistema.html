<script>

const usuario = localStorage.getItem("usuario");

if (!usuario) {
    window.location.href = "login.html";
}

const dadosUsuario = JSON.parse(usuario);
document.getElementById("nomeUsuario").innerText =
    "Usuário: " + dadosUsuario.nome;


// MENU COLABORADORES

            </div>

// LISTAR
async function listarUsuarios() {

    const resposta = await fetch("https://agenda-medica-backend-qfss.onrender.com/usuarios");
    const dados = await resposta.json();

    let html = `
    <table class="table table-bordered table-hover">
        <thead>
            <tr>
                <th></th>
                <th>ID</th>
                <th>Nome</th>
                <th>Login</th>
            </tr>
        </thead>
        <tbody>
`;

    dados.forEach(u => {
        html += `
            <tr onclick="selecionarLinha(this)">
                <td><input type="radio" name="usuario" value="${u.id}"></td>
                <td>${u.id}</td>
                <td>${u.nome}</td>
                <td>${u.login}</td>
            </tr>
        `;
    });

    html += "</tbody></table>";

    document.getElementById("areaTrabalho").innerHTML = html;
}


function selecionarLinha(linha) {

    document.querySelectorAll("#areaTrabalho tbody tr").forEach(tr => {
        tr.classList.remove("linha-selecionada");
    });

    linha.classList.add("linha-selecionada");

    const radio = linha.querySelector("input[type='radio']");
    if (radio) radio.checked = true;
}


// CADASTRO
function abrirCadastro() {
    document.getElementById("areaTrabalho").innerHTML = `
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                Novo Colaborador
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input id="nome" class="form-control" placeholder="Digite o nome">
                </div>

                <div class="mb-3">
                    <label class="form-label">Login</label>
                    <input id="login" class="form-control" placeholder="Digite o login">
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input id="senha" type="password" class="form-control" placeholder="Digite a senha">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <button class="btn btn-secondary" onclick="listarUsuarios()">Cancelar</button>
                    <button class="btn btn-success" onclick="salvarUsuario()">Salvar</button>
                </div>

            </div>
        </div>
    `;
}

// SALVAR
async function salvarUsuario() {

    const nome = document.getElementById("nome").value;
    const login = document.getElementById("login").value;
    const senha = document.getElementById("senha").value;

    const resposta = await fetch("https://agenda-medica-backend-qfss.onrender.com/cadastro", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ nome, login, senha })
    });

    const dados = await resposta.json();

    alert(dados.mensagem || dados.erro);

    listarUsuarios();
}


// PEGAR SELECIONADO
function getSelecionado() {
    const selecionado = document.querySelector('input[name="usuario"]:checked');
    return selecionado ? selecionado.value : null;
}


// EXCLUIR
async function excluirUsuario() {

    const id = getSelecionado();

    if (!id) {
        alert("Selecione um usuário");
        return;
    }

    if (!confirm("Deseja excluir?")) return;

    await fetch(`https://agenda-medica-backend-qfss.onrender.com/usuarios/${id}`, {
        method: "DELETE"
    });

    listarUsuarios();
}


// EDITAR (BASE)

async function editarUsuario() {

    const id = getSelecionado();

    if (!id) {
        alert("Selecione um usuário");
        return;
    }

    // Buscar dados do usuário
    const resposta = await fetch(`https://agenda-medica-backend-qfss.onrender.com/usuarios/${id}`);
    const u = await resposta.json();

    // Mostrar formulário preenchido
    document.getElementById("areaTrabalho").innerHTML = `
        <h4>Editar Colaborador</h4>

        <input id="nome" class="form-control mb-2" value="${u.nome}">
        <input id="login" class="form-control mb-2" value="${u.login}">
        <input id="senha" type="password" class="form-control mb-2" placeholder="Nova senha">

        <button class="btn btn-success" onclick="atualizarUsuario(${u.id})">Salvar</button>
        <button class="btn btn-secondary" onclick="listarUsuarios()">Voltar</button>
    `;
}

async function atualizarUsuario(id) {

    const nome = document.getElementById("nome").value;
    const login = document.getElementById("login").value;
    const senha = document.getElementById("senha").value;

    const resposta = await fetch(`https://agenda-medica-backend-qfss.onrender.com/usuarios/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ nome, login, senha })
    });

    const dados = await resposta.json();

    alert(dados.mensagem || dados.erro);

    listarUsuarios();
}

async function listarClientes() {

    let html = `
    <table class="table table-bordered table-hover">
        <thead>
            <tr>
                <th></th>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Nascimento</th>
                <th>Telefone</th>
            </tr>
        </thead>
        <tbody>
    `;

    dados.forEach(c => {
        html += `
            <tr onclick="selecionarLinha(this)">
                <td><input type="radio" name="cliente" value="${c.id}"></td>
                <td>${c.id}</td>
                <td>${c.nome}</td>
                <td>${c.cpf}</td>
                <td>${c.nascimento ? new Date(c.nascimento).toLocaleDateString() : ""}</td>
                <td>${c.telefone}</td>
            </tr>
        `;
    });

    html += "</tbody></table>";

    document.getElementById("areaTrabalho").innerHTML = html;
}
